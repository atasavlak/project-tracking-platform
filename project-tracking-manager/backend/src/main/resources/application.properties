spring.application.name=projecttracking

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/projecttracking}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:projecttracking}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:projecttracking}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${APP_MAIL_FROM:no-reply@projecttracking.local}
app.activation-token-expiration-hours=${APP_ACTIVATION_TOKEN_EXPIRATION_HOURS:24}
app.frontend.activation-url=${APP_FRONTEND_ACTIVATION_URL:http://localhost:5173/activate}
app.password-reset-token-expiration-minutes=${APP_PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:15}
app.frontend.password-reset-url=${APP_FRONTEND_PASSWORD_RESET_URL:http://localhost:5173/reset-password}
app.sample-data.enabled=${APP_SAMPLE_DATA_ENABLED:true}
app.frontend.allowed-origins=${APP_FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}
